[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homeotrack"
version = "0.1.0"
description = "AI-First Homeopathic Clinical Decision Support System"
authors = [{ name = "HomeoTrack Team" }]
readme = "implementation_plan.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pytest>=7.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["homeotrack*"]

[project.scripts]
homeotrack-ingest = "homeotrack.database.ingest_oorep:main"
